[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mcptox-gateway"
version = "0.1.0"
description = "Offline-first foundation for the MCPTox actor and reviewer experiment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel==6.31.0",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "pandas==2.3.3",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
